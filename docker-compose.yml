services:
  decidim-user_fields:
    container_name: decidim-user_fields
    command: bash -c "sleep infinity"
    image: octree/decidim-dev:0.29
    entrypoint: ""
    volumes:
      - .:/home/module
      - bundle:/home/decidim/vendor
      - node_modules:/home/decidim/node_modules
    environment:
      - PORT=3000
      - DATABASE_HOST=pg
      - DATABASE_USERNAME=decidim
      - DATABASE_PASSWORD=pleaseChangeMe
      - DATABASE_URL=postgresql://decidim:pleaseChangeMe@user-fields-pg:5432/decidim
      - DECIDIM_VERSION=0.29.4
      - DEV_MODULE=decidim-user_fields
      - RAILS_ENV=development
    ports:
      - 3000:3000
    depends_on:
      user-fields-pg:
        condition: service_healthy

  user-fields-pg:
    container_name: user-fields-pg
    image: postgres:16
    volumes:
      - user_fields-pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DATABASE=decidim
      - POSTGRES_USER=decidim
      - POSTGRES_PASSWORD=pleaseChangeMe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim -d decidim"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  node_modules: {}
  bundle: {}
  user_fields-pg-data: {}
